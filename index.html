<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello, world!</title>
  <style>
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 2rem;
      color: #493b36;
      background: linear-gradient(145deg, #fff7e8, #ffe3d5);
      font-family: system-ui, sans-serif;
      text-align: center;
    }
    main {
      max-width: 34rem;
      padding: 3rem 3.5rem;
      background: #fffdf9;
      border: 1px solid #f4d8c8;
      border-radius: 2rem;
      box-shadow: 0 1rem 3rem #9b63431c;
    }
    .smiley { margin: 0 0 1rem; font-size: 4rem; line-height: 1; }
    h1 { margin: 0; color: #bc5b3d; font-size: clamp(2.25rem, 8vw, 3.5rem); }
    p { margin: 1rem 0 0; color: #76665e; font-size: 1.125rem; }
  </style>
</head>
<body>
  <main>
    <div class="smiley" role="img" aria-label="Smiling face">😊</div>
    <h1>Hello, world!</h1>
    <p>It’s lovely to see you here.</p>
  </main>
</body>
</html>
