<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello, world!</title>
  <style>
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 2rem;
      color: #573348;
      background: linear-gradient(145deg, #fff0f6, #ffc7de);
      font-family: system-ui, sans-serif;
      text-align: center;
    }
    main {
      max-width: 34rem;
      padding: 3rem 3.5rem;
      background: #fffafd;
      border: 1px solid #f5b6d0;
      border-radius: 2rem;
      box-shadow: 0 1rem 3rem #a43d6b20;
    }
    .pig { margin: 0 0 1rem; font-size: 4rem; line-height: 1; }
    h1 { margin: 0; color: #c13f79; font-size: clamp(2.25rem, 8vw, 3.5rem); }
    p { margin: 1rem 0 0; color: #80566c; font-size: 1.125rem; }
  </style>
</head>
<body>
  <main>
    <div class="pig" role="img" aria-label="Pig">🐷</div>
    <h1>Hello, world!</h1>
    <p>It’s lovely to see you here.</p>
  </main>
</body>
</html>
